[project]
name = "trace-inversion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch==2.13.0",
    "transformers>=5.16.1",
    "trl>=1.12.0",
    "peft>=0.20.0",
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "kernels>=0.16.1",
    "flash-linear-attention>=0.5.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[tool.uv]
no-build-isolation-package = ["causal-conv1d"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
